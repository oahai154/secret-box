[package]
name = "secretbox-core"
version = "0.1.0"
edition.workspace = true
description = "SecretBox 核心库：加密层与 SQLite 存储层（与 Go 版逐字节兼容）"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
